name: Build OS APPELE TV Preview

on:
  push:
    branches: [ main ]
    paths:
      - 'ozdemir-launcher/**'
      - 'scripts/sync_figma_home_assets.sh'
      - '.github/workflows/ozdemir-launcher-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync approved Figma home artwork
        run: bash scripts/sync_figma_home_assets.sh

      - name: Build preview APK
        working-directory: ozdemir-launcher
        run: gradle --no-daemon assemblePreview

      - name: Prepare artifact
        run: |
          mkdir -p dist-preview
          cp ozdemir-launcher/app/build/outputs/apk/preview/app-preview.apk dist-preview/OS-APPELE-TV-Preview.apk
          sha256sum dist-preview/OS-APPELE-TV-Preview.apk > dist-preview/OS-APPELE-TV-Preview.sha256

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: OS-APPELE-TV-Preview
          path: |
            dist-preview/OS-APPELE-TV-Preview.apk
            dist-preview/OS-APPELE-TV-Preview.sha256
          if-no-files-found: error
