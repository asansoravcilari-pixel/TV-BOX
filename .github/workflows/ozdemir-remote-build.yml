name: Build Ozdemir Remote APKs v1.2.0

on:
  push:
    branches:
      - main
      - ozremote-v1.2.0-finalprod
    paths:
      - 'OzdemirRemote/**'
      - '.github/workflows/ozdemir-remote-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct, repair and verify v1.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ozremote"
          cat \
            OzdemirRemote/v1.2-full/part00.b64 \
            OzdemirRemote/v1.2-full/part01.b64 \
            OzdemirRemote/v1.2-full/part02.b64 \
            OzdemirRemote/v1.2-full/part03.b64 \
            OzdemirRemote/v1.2-full/part04.b64 \
            OzdemirRemote/v1.2-full/part05.b64 \
            | base64 -d > "$RUNNER_TEMP/OzdemirRemote-source.zip"

          EXPECTED_SHA="b40b94366af1d701a2e61f0d51e2ba12faf9ac56fa3cb9756355a956d401af68"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/OzdemirRemote-source.zip" | awk '{print $1}')"
          echo "source sha256=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          set +e
          TEST_OUT="$(unzip -t "$RUNNER_TEMP/OzdemirRemote-source.zip" 2>&1)"
          TEST_RC=$?
          set -e
          printf '%s\n' "$TEST_OUT"
          if [ "$TEST_RC" -ne 0 ]; then
            BAD_COUNT="$(printf '%s\n' "$TEST_OUT" | grep -c 'bad CRC' || true)"
            test "$BAD_COUNT" -eq 1
            printf '%s\n' "$TEST_OUT" | grep -E 'SecureChannel\.kt.*bad CRC' >/dev/null
          fi

          set +e
          unzip -q "$RUNNER_TEMP/OzdemirRemote-source.zip" -d "$RUNNER_TEMP/ozremote"
          UNZIP_RC=$?
          set -e
          test "$UNZIP_RC" -eq 0 -o "$UNZIP_RC" -eq 2

          ROOT="$RUNNER_TEMP/ozremote/OzdemirRemote"
          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/phone/build.gradle.kts"
          test -f "$ROOT/tv/build.gradle.kts"
          grep -q 'versionName = "1.2.0"' "$ROOT/phone/build.gradle.kts"
          grep -q 'versionName = "1.2.0"' "$ROOT/tv/build.gradle.kts"

          cat > "$ROOT/core/src/main/java/com/ozdemir/remote/core/SecureChannel.kt" <<'KOTLIN'
          package com.ozdemir.remote.core

          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.BufferedWriter
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.Socket
          import java.util.UUID
          import java.util.concurrent.atomic.AtomicLong

          class SecureChannel(
              private val socket: Socket,
              private val key: ByteArray,
              private val reader: BufferedReader = BufferedReader(InputStreamReader(socket.getInputStream())),
              private val writer: BufferedWriter = BufferedWriter(OutputStreamWriter(socket.getOutputStream()))
          ) : AutoCloseable {
              private val sendCounter = AtomicLong(1)
              private var recvCounter = 0L

              @Synchronized fun send(obj: JSONObject) {
                  val counter = sendCounter.getAndIncrement()
                  val wrapper = JSONObject().apply {
                      put("counter", counter)
                      put("payload", Crypto.encrypt(key, counter, obj.toString().toByteArray()))
                  }
                  writer.write(wrapper.toString())
                  writer.newLine()
                  writer.flush()
              }

              fun receive(): JSONObject {
                  val line = reader.readLine() ?: throw IllegalStateException("Connection closed")
                  val wrapper = JSONObject(line)
                  val counter = wrapper.getLong("counter")
                  require(counter > recvCounter) { "Replay/out-of-order packet" }
                  recvCounter = counter
                  return JSONObject(String(Crypto.decrypt(key, counter, wrapper.getString("payload"))))
              }

              override fun close() = socket.close()
          }

          data class PairResult(val pairId: String, val key: ByteArray)

          object PairingClient {
              fun pair(host: String, port: Int, pin: String): PairResult {
                  val pairId = UUID.randomUUID().toString()
                  Socket(host, port).use { s ->
                      s.soTimeout = 6000
                      val r = BufferedReader(InputStreamReader(s.getInputStream()))
                      val w = BufferedWriter(OutputStreamWriter(s.getOutputStream()))
                      val kp = Crypto.ecKeyPair()
                      val hello = JSONObject().apply {
                          put("type", "pair_hello")
                          put("pairId", pairId)
                          put("publicKey", Crypto.publicB64(kp.public))
                      }
                      w.write(hello.toString()); w.newLine(); w.flush()
                      val challenge = JSONObject(r.readLine())
                      if (challenge.optString("type") == "pair_error") {
                          error(challenge.optString("message", "Eşleştirme geçici olarak engellendi"))
                      }
                      require(challenge.getString("type") == "pair_challenge")
                      val tvPub = Crypto.publicKey(challenge.getString("publicKey"))
                      val salt = Crypto.unb64(challenge.getString("salt"))
                      val key = Crypto.derivePairKey(Crypto.ecdh(kp.private, tvPub), pin, salt)
                      val proof = Crypto.hmac(key, "phone-proof".toByteArray())
                      w.write(JSONObject().apply { put("type", "pair_proof"); put("proof", Crypto.b64(proof)) }.toString())
                      w.newLine(); w.flush()
                      val ok = JSONObject(r.readLine())
                      require(ok.optBoolean("ok")) { "PIN eşleşmedi" }
                      val expected = Crypto.hmac(key, "tv-proof".toByteArray())
                      require(Crypto.unb64(ok.getString("proof")).contentEquals(expected)) { "TV doğrulanamadı" }
                      return PairResult(pairId, key)
                  }
              }
          }
          KOTLIN

          REPAIRED_SHA="$(sha256sum "$ROOT/core/src/main/java/com/ozdemir/remote/core/SecureChannel.kt" | awk '{print $1}')"
          echo "repaired SecureChannel sha256=$REPAIRED_SHA"
          test "$REPAIRED_SHA" = "677ed5160fa4f2ed9b230fec254d03bb0b3c3613ff2f8acd7419623f533536af"

          sed -i 's/compileSdk = 37/compileSdk = 36/g' \
            "$ROOT/phone/build.gradle.kts" \
            "$ROOT/tv/build.gradle.kts" \
            "$ROOT/core/build.gradle.kts"
          sed -i 's/compose-bom:2026.08.00/compose-bom:2026.06.00/g' \
            "$ROOT/phone/build.gradle.kts" \
            "$ROOT/tv/build.gradle.kts"
          sed -i 's/activity-compose:1.13.0/activity-compose:1.12.2/g' \
            "$ROOT/phone/build.gradle.kts" \
            "$ROOT/tv/build.gradle.kts"

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "ozremote" / "OzdemirRemote"

          main = root / "phone/src/main/java/com/ozdemir/remote/phone/MainActivity.kt"
          s = main.read_text()
          required = "import androidx.activity.compose.setContent\n"
          anchor = "import androidx.activity.ComponentActivity\n"
          if required not in s and anchor in s:
              s = s.replace(anchor, anchor + required)
          main.write_text(s)

          mirror = root / "phone/src/main/java/com/ozdemir/remote/phone/MirrorSenderService.kt"
          s = mirror.read_text()
          old = (
              "        projection = mgr.getMediaProjection(resultCode, data).also { p ->\n"
              "            p.registerCallback(object : MediaProjection.Callback() { override fun onStop() { stopSelf() } }, null)\n"
              "        }\n"
          )
          new = (
              "        val activeProjection = mgr.getMediaProjection(resultCode, data) ?: run {\n"
              "            running = false\n"
              "            stopSelf()\n"
              "            return\n"
              "        }\n"
              "        activeProjection.registerCallback(object : MediaProjection.Callback() { override fun onStop() { stopSelf() } }, null)\n"
              "        projection = activeProjection\n"
          )
          if old in s:
              s = s.replace(old, new)
          s = s.replace(
              "        projection!!.createVirtualDisplay(\"OzdemirMirror\", width, height, resources.displayMetrics.densityDpi,\n",
              "        activeProjection.createVirtualDisplay(\"OzdemirMirror\", width, height, resources.displayMetrics.densityDpi,\n",
          )
          mirror.write_text(s)

          tvserver = root / "tv/src/main/java/com/ozdemir/remote/tv/RemoteServerService.kt"
          s = tvserver.read_text()
          explicit = "import com.ozdemir.remote.core.RemoteAction\n"
          wildcard = "import com.ozdemir.remote.core.*\n"
          if explicit not in s and wildcard in s:
              s = s.replace(wildcard, wildcard + explicit)
          tvserver.write_text(s)
          PY

      - name: Build phone and TV APKs
        working-directory: ${{ runner.temp }}/ozremote/OzdemirRemote
        run: gradle :phone:assembleDebug :tv:assembleDebug --stacktrace --no-daemon

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$RUNNER_TEMP/ozremote/OzdemirRemote/phone/build/outputs/apk/debug/phone-debug.apk" \
            out/Ozdemir-Remote-Phone-v1.2.0-debug.apk
          cp "$RUNNER_TEMP/ozremote/OzdemirRemote/tv/build/outputs/apk/debug/tv-debug.apk" \
            out/Ozdemir-Receiver-TV-v1.2.0-debug.apk
          (cd out && sha256sum *.apk > APK-SHA256.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ozdemir-Remote-APKs-v1.2.0-Figma
          path: out/*
          if-no-files-found: error
