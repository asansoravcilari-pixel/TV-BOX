name: Build OZDEMIR TV OS Launcher

on:
  push:
    branches: [ main ]
    paths:
      - 'ozdemir-launcher/**'
      - '.github/workflows/ozdemir-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ozdemir-launcher
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to repo
        run: |
          mkdir -p dist
          cp ozdemir-launcher/app/build/outputs/apk/debug/app-debug.apk dist/OZDEMIR-TV-OS-Launcher.apk
          sha256sum dist/OZDEMIR-TV-OS-Launcher.apk > dist/OZDEMIR-TV-OS-Launcher.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/OZDEMIR-TV-OS-Launcher.apk dist/OZDEMIR-TV-OS-Launcher.sha256
          git diff --cached --quiet || git commit -m 'Build OZDEMIR TV OS launcher APK'
          git push
