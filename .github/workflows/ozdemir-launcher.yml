name: Build Restored OS APPELE TV Launcher

on:
  push:
    branches: [ restore-appletv-launcher ]
    paths:
      - 'ozdemir-launcher/**'
      - '.github/workflows/ozdemir-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

actions:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ozdemir-launcher
        run: gradle --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp ozdemir-launcher/app/build/outputs/apk/debug/app-debug.apk dist/OS-APPELE-TV-RESTORED.apk
          sha256sum dist/OS-APPELE-TV-RESTORED.apk > dist/OS-APPELE-TV-RESTORED.sha256

      - name: Upload restored APK
        uses: actions/upload-artifact@v4
        with:
          name: OS-APPELE-TV-RESTORED
          path: |
            dist/OS-APPELE-TV-RESTORED.apk
            dist/OS-APPELE-TV-RESTORED.sha256
